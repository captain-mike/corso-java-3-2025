<app-layout1>

  <h1>Crea una pizza</h1>

<ng-container *ngIf="isLoading">
  <div>Caricamento</div>
</ng-container>

  <form *ngIf="!isLoading">

    <div class="my-3">
      <input type="text" name="gusto" [(ngModel)]="newPizza.gusto"  placeholder="Gusto" class="form-control">
    </div>
    <div class="mb-3">
      <input type="number" name="prezzo" [(ngModel)]="newPizza.prezzo" placeholder="Prezzo" class="form-control">
    </div>

    <div class="mb-3">
      <label for="disp">Disponibile </label>
      <input name="disp" [(ngModel)]="newPizza.disp" id="disp" type="checkbox">
    </div>

    <button (click)="addPizza()" class="btn btn-primary">Crea</button>


  </form>

</app-layout1>
